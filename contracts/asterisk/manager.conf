; AMI нужен ТОЛЬКО для запасной схемы без ARI (контекст saqta-audiosocket). В основной ARI-схеме не используется.
; AMI для бэкенда (необязательно): перевод на оператора = Setvar SAQTA_SUMMARY + Redirect в saqta-transfer,<queue>,1.
; Бэкенд: AMI_HOST, AMI_PORT=5038, AMI_USER=voicerouter, AMI_SECRET. Без AMI_HOST перевод делает диалплан по /outcome.
; Проверено на Asterisk 22.10. В infra/asterisk уже есть пользователь voice-ai с нужными правами — можно указать его.
[general]
enabled=yes
port=5038
bindaddr=0.0.0.0

[voicerouter]
secret=change-me
; сузьте до IP ноутбука с бэкендом, например 192.168.1.50/255.255.255.255
permit=0.0.0.0/0.0.0.0
read=call,system
write=call,originate
