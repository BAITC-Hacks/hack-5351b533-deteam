; Voice Router: входящий звонок → регистрация → AudioSocket → (перевод через AMI Redirect)
; Нужны модули: app_audiosocket, func_curl, res_pjsip.  Бэкенд: api:8000 (HTTP), api:9092 (AudioSocket)

[globals]
VR_API=http://api:8000
VR_AS=api:9092
OPERATOR=PJSIP/operator

[saqta-inbound]
; Номер контакт-центра из базы знаний: +7 727 000 7575 → внутренний 7575
exten => 7575,1,NoOp(Saqta inbound from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(CALL_UUID=${CURL(${VR_API}/api/telephony/calls,caller=${CALLERID(num)}&dnid=${EXTEN}&channel=${CHANNEL}&uniqueid=${UNIQUEID})})
 same => n,GotoIf($["${CALL_UUID}" = ""]?fallback)
 same => n,AudioSocket(${CALL_UUID},${VR_AS})
 ; Запасной путь: если AudioSocket вернул управление, спрашиваем исход
 same => n,Set(OUTCOME=${CURL(${VR_API}/api/telephony/calls/${CALL_UUID}/outcome)})
 same => n,GotoIf($["${CUT(OUTCOME,:,1)}" = "transfer"]?saqta-transfer,${CUT(OUTCOME,:,2)},1)
 same => n,Hangup()
 same => n(fallback),Goto(saqta-transfer,operator_general,1)

; Демо: 7575NN звонит от имени персоны CNN из mock_backend (+770100000NN)
exten => _7575XX,1,Set(CALLERID(num)=+770100000${EXTEN:4:2})
 same => n,Goto(saqta-inbound,7575,1)

exten => h,1,GotoIf($["${CALL_UUID}" = ""]?done)
 same => n,Set(R=${CURL(${VR_API}/api/telephony/calls/${CALL_UUID}/hangup,cause=${HANGUPCAUSE})})
 same => n(done),NoOp(end)

[saqta-transfer]
; Сюда бэкенд переводит канал через AMI Redirect (Exten = имя очереди).
; SAQTA_SUMMARY выставляется бэкендом через AMI Setvar перед Redirect.
exten => _[a-z].,1,NoOp(Transfer to ${EXTEN}: ${SAQTA_SUMMARY})
 same => n,Set(CALLERID(name)=Saqta ${EXTEN})
 same => n,Dial(${OPERATOR},30)
 same => n,Hangup()
