; Voice Router (Saqta Insurance). Протокол и тесты: docs/telephony/README.md.
;
; ОСНОВНАЯ СХЕМА (ARI): входящий звонок -> ARI-приложение voice-ai (наш бэкенд) -> перевод на оператора через saqta-transfer.
; Звук бэкенд забирает сам: через ARI создаёт канал External Media (AudioSocket по TCP) и бриджует его со звонящим.
; Нужны модули: res_ari, res_stasis, res_http_websocket, res_pjsip, chan_audiosocket / res_audiosocket.
; Проверено на Asterisk 22.10 (docker andrius/asterisk).
;
; ЗАПАСНАЯ СХЕМА (без ARI): контекст [saqta-audiosocket] ниже: CURL-регистрация + AudioSocket() из диалплана.
; Включается сама, если бэкенд не подключён к ARI (Stasis вернул FAILED), или вручную: context=saqta-audiosocket у эндпоинта.
; Для неё нужны ещё app_audiosocket, func_curl, res_curl, func_uri, func_cut, func_env.

[globals]
; Для запасной схемы: адреса бэкенда. Переменные окружения Asterisk VR_API / VR_AS перекрывают значения ниже.
;  - Asterisk в Docker (bridge) на том же ноутбуке -> host.docker.internal (compose: extra_hosts: ["host.docker.internal:host-gateway"])
;  - Asterisk с network_mode: host на том же Linux-ноутбуке -> VR_API=http://127.0.0.1:8000, VR_AS=127.0.0.1:9092
;  - Asterisk на другом ПК в LAN -> LAN-IP ноутбука, например VR_API=http://192.168.1.50:8000, VR_AS=192.168.1.50:9092
VR_API=http://host.docker.internal:8000
VR_AS=host.docker.internal:9092
; Куда звонит перевод (обе схемы)
OPERATOR=PJSIP/operator

; ============================================================ ОСНОВНАЯ СХЕМА: ARI

[from-inbound]
; Любой набранный номер -> голосовой агент. Номер звонящего бэкенд берёт из события StasisStart (CALLERID(num)).
exten => _X.,1,NoOp(Saqta inbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Gosub(record-call,s,1)
 same => n,Stasis(voice-ai)
 ; сюда попадаем, только если приложение voice-ai не зарегистрировано (бэкенд не подключён к ARI) -> запасная схема
 same => n,GotoIf($["${STASISSTATUS}" = "FAILED"]?saqta-audiosocket,7575,1)
 same => n,Hangup()

; Демо-трюк: 7575NN звонит от имени персоны CNN из mock_backend (+770100000NN), например 757507 = Сергей, 757504 = Наталья
exten => _7575XX,1,Set(CALLERID(num)=+770100000${EXTEN:4:2})
 same => n,Answer()
 same => n,Gosub(record-call,s,1)
 same => n,Stasis(voice-ai)
 same => n,GotoIf($["${STASISSTATUS}" = "FAILED"]?saqta-audiosocket,7575,1)
 same => n,Hangup()

; Звонок с транка без DID
exten => s,1,Goto(from-inbound,7575,1)

[record-call]
; Скрипт recording-finished входит в Docker-образ infra/asterisk.
exten => s,1,Set(RECORDING_ID=${UNIQUEID})
 same => n,MixMonitor(/var/spool/asterisk/monitor/${RECORDING_ID}.wav,i(RECORDING_MIX_ID),/usr/bin/python3 /usr/local/bin/recording-finished ${RECORDING_ID})
 same => n,Set(CHANNEL(hangup_handler_push)=recording-finish,s,1)
 same => n,Return()

[recording-finish]
exten => s,1,StopMixMonitor(${RECORDING_MIX_ID})
 same => n,Return()

[saqta-transfer]
; Сюда бэкенд переводит звонящего через ARI: POST /channels/{id}/continue?context=saqta-transfer&extension=<queue>&priority=1
; Перед этим бэкенд ставит переменную SAQTA_SUMMARY (резюме разговора для оператора).
; Запасная схема приходит сюда через AMI Redirect или Goto по /outcome.
; Очереди: operator_general, claims_team, medical_assistance_24_7, corporate_sales, complaints_team, security_team
exten => _[a-z].,1,NoOp(Transfer to ${EXTEN}: ${SAQTA_SUMMARY})
 same => n,Set(CALLERID(name)=Saqta ${EXTEN})
 same => n,Dial(${OPERATOR},30)
 same => n,Hangup()

; только для запасной схемы (в ARI-схеме CALL_UUID пуст, CURL не вызывается)
exten => h,1,GotoIf($[${LEN(${CALL_UUID})} != 36]?done)
 same => n,Set(R=${CURL(${API}/api/telephony/calls/${CALL_UUID}/hangup,cause=${HANGUPCAUSE})})
 same => n(done),NoOp(end ${CALL_UUID} cause=${HANGUPCAUSE})

; ============================================================ ЗАПАСНАЯ СХЕМА: без ARI (CURL + AudioSocket())

[saqta-audiosocket]
; Номер контакт-центра из базы знаний: +7 727 000 7575 -> внутренний 7575
exten => 7575,1,NoOp(Saqta inbound (AudioSocket fallback) from ${CALLERID(num)} on ${CHANNEL})
 same => n,Set(API=${VR_API})
 same => n,Set(AS=${VR_AS})
 same => n,ExecIf($["${ENV(VR_API)}" != ""]?Set(API=${ENV(VR_API)}))
 same => n,ExecIf($["${ENV(VR_AS)}" != ""]?Set(AS=${ENV(VR_AS)}))
 same => n,Answer()
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=4)
 ; 1. регистрация: бэкенд запоминает номер (caller-ID -> клиент, приветствие по имени) и канал (для AMI Redirect)
 same => n,Set(CALL_UUID=${CURL(${API}/api/telephony/calls,caller=${URIENCODE(${CALLERID(num)})}&dnid=${EXTEN}&channel=${URIENCODE(${CHANNEL})}&uniqueid=${UNIQUEID})})
 same => n,GotoIf($[${LEN(${CALL_UUID})} != 36]?fallback)
 ; 2. разговор с агентом: slin 8 kHz в обе стороны. TryExec всегда возвращает в диалплан (TRYSTATUS=SUCCESS|FAILED)
 same => n,TryExec(AudioSocket(${CALL_UUID},${AS}))
 ; 3. сюда попадаем, если бэкенд прислал hangup (0x00) и AMI не настроен/не сработал: спрашиваем исход
 same => n,Set(OUTCOME=${CURL(${API}/api/telephony/calls/${CALL_UUID}/outcome)})
 same => n,NoOp(AudioSocket ${TRYSTATUS}, outcome=${OUTCOME})
 same => n,GotoIf($["${CUT(OUTCOME,:,1)}" = "transfer"]?saqta-transfer,${CUT(OUTCOME,:,2)},1)
 same => n,GotoIf($["${TRYSTATUS}" = "FAILED"]?fallback)
 same => n,Hangup()
 ; бэкенд недоступен или сокет оборвался — не бросаем клиента, ведём на оператора
 same => n(fallback),Goto(saqta-transfer,operator_general,1)

; Демо: 7575NN от имени персоны CNN (+770100000NN): 757504 = Natalia Smirnova, 757507 = Sergey Popov
exten => _7575XX,1,Set(CALLERID(num)=+770100000${EXTEN:4:2})
 same => n,Goto(saqta-audiosocket,7575,1)
; любой другой номер -> агент
exten => _X.,1,Goto(saqta-audiosocket,7575,1)

exten => h,1,GotoIf($[${LEN(${CALL_UUID})} != 36]?done)
 same => n,Set(R=${CURL(${API}/api/telephony/calls/${CALL_UUID}/hangup,cause=${HANGUPCAUSE})})
 same => n(done),NoOp(end ${CALL_UUID} cause=${HANGUPCAUSE})
