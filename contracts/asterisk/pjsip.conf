; Минимум для демо PC-to-PC: софтфон клиента 1001 (на другом ПК в LAN) и софтфон оператора operator.
; Звонок: 1001 набирает любой номер (или 7575NN — от имени персоны CNN) -> from-inbound -> Stasis(voice-ai) -> бэкенд по ARI.
; Запасная схема без ARI: context=saqta-audiosocket (см. extensions.conf).
;
; Если Asterisk в Docker с пробросом портов (bridge, Windows/macOS Docker Desktop), раскомментируйте external_* и
; укажите LAN-IP машины с Docker, иначе в SDP уйдёт внутренний 172.x и звука не будет. На Linux проще network_mode: host.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
;external_media_address=192.168.1.60
;external_signaling_address=192.168.1.60
;local_net=172.16.0.0/12
;local_net=192.168.0.0/16

[1001]
type=endpoint
transport=transport-udp
context=from-inbound
disallow=all
allow=ulaw,alaw
auth=1001
aors=1001
callerid="Demo client" <+77010000007>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
[1001]
type=auth
auth_type=userpass
username=1001
password=change-me
[1001]
type=aor
max_contacts=1
remove_existing=yes

[operator]
type=endpoint
transport=transport-udp
context=from-inbound
disallow=all
allow=ulaw,alaw
auth=operator
aors=operator
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
[operator]
type=auth
auth_type=userpass
username=operator
password=change-me
[operator]
type=aor
max_contacts=1
remove_existing=yes
